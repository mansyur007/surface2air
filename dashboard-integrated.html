<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRSAM Operator Simulator — Integrated Dashboard</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* ═══════════════════════════════════════════════════════════════ */
    /* RESET + BASE                                                    */
    /* ═══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0b0d0b;
      color: #cfd8d4;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 12px;
      letter-spacing: 0.01em;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* LAYOUT: Side-by-side dashboard (React) + canvas (Three.js)      */
    /* ═══════════════════════════════════════════════════════════════ */
    body {
      display: grid;
      grid-template-rows: 64px 1fr 32px;
      grid-template-columns: 1fr;
    }

    #topbar {
      grid-area: 1 / 1;
      background: #0f1410;
      border-bottom: 1px solid rgba(207, 216, 212, 0.15);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    #main-container {
      grid-area: 2 / 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      min-width: 0;
    }

    #canvas-container {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1f1a 0%, #0b0d0b 100%);
      border: 1px solid rgba(207, 216, 212, 0.15);
      flex: 1;
      min-height: 0;
    }

    #app {
      width: 100%;
      height: 100%;
      display: block;
    }

    #bottombar {
      grid-area: 3 / 1;
      background: #0f1410;
      border-top: 1px solid rgba(207, 216, 212, 0.15);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: #9ca5a0;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* TOPBAR STYLING                                                  */
    /* ═══════════════════════════════════════════════════════════════ */
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px;
      border: 1px solid rgba(207, 216, 212, 0.2);
      background: #151917;
      display: grid;
      place-items: center;
      border-radius: 2px;
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      color: #6fc97f;
    }
    .brand-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #6fc97f;
    }
    .brand-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: #7b8580;
      margin-top: 2px;
    }

    .top-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(207, 216, 212, 0.15);
      background: #151917;
      border-radius: 2px;
      font-family: "JetBrains Mono", monospace;
      line-height: 1;
    }

    .pill-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #7b8580;
    }

    .pill-value {
      font-size: 12px;
      font-weight: 600;
      color: #cfd8d4;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* PANEL STYLING                                                   */
    /* ═══════════════════════════════════════════════════════════════ */
    .panel {
      background: #151917;
      border: 1px solid rgba(207, 216, 212, 0.15);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0f1410;
      border-bottom: 1px solid rgba(207, 216, 212, 0.15);
    }

    .panel-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #6fc97f;
    }

    .panel-meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #7b8580;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* TRACK TABLE STYLING                                             */
    /* ═══════════════════════════════════════════════════════════════ */
    .tracks-panel {
      padding: 0;
      overflow-y: auto;
      flex: 1;
    }

    .track-table {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      width: 100%;
    }

    .track-head {
      display: grid;
      grid-template-columns: 48px 60px 36px 38px 36px 36px 48px 36px;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      color: #7b8580;
      font-size: 9px;
      letter-spacing: 0.12em;
      cursor: default;
      background: rgba(15, 20, 16, 0.5);
      border-bottom: 1px solid rgba(207, 216, 212, 0.1);
      position: sticky;
      top: 0;
    }

    .track-row {
      display: grid;
      grid-template-columns: 48px 60px 36px 38px 36px 36px 48px 36px;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(207, 216, 212, 0.05);
      cursor: pointer;
      transition: background 0.1s;
    }

    .track-row:hover {
      background: rgba(111, 201, 127, 0.06);
    }

    .track-row.selected {
      background: rgba(111, 201, 127, 0.14);
      border-left: 2px solid #6fc97f;
      padding-left: 8px;
    }

    .track-cell {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .t-id {
      color: #cfd8d4;
      font-weight: 600;
    }

    .t-class {
      color: #7b8580;
      font-size: 10px;
    }

    .t-hostile {
      color: #ff6b6b;
    }

    .t-friendly {
      color: #5ba3ff;
    }

    .t-unknown {
      color: #ffa500;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* RADAR SCOPE STYLING                                             */
    /* ═══════════════════════════════════════════════════════════════ */
    .scope-panel {
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .scope-wrap {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #0f1410 0%, #0b0d0b 100%);
      padding: 14px;
      min-height: 0;
    }

    .scope-wrap > svg {
      max-height: 100%;
      max-width: 100%;
      aspect-ratio: 1;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* BATTERIES PANEL                                                 */
    /* ═══════════════════════════════════════════════════════════════ */
    .batteries {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .battery {
      border: 1px solid rgba(207, 216, 212, 0.1);
      background: #0f1410;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .battery-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .battery-id {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      color: #cfd8d4;
      letter-spacing: 0.06em;
    }

    .battery-kind {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: #7b8580;
      margin-top: 2px;
    }

    .battery-cells {
      display: flex;
      gap: 4px;
    }

    .cell {
      flex: 1;
      height: 14px;
      border: 1px solid rgba(207, 216, 212, 0.1);
      position: relative;
    }

    .cell.loaded {
      background: rgba(111, 201, 127, 0.35);
      border-color: #6fc97f;
      box-shadow: inset 0 0 6px rgba(111, 201, 127, 0.3);
    }

    .cell.empty {
      background: #0b0d0b;
      opacity: 0.55;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* FOOTER / STATUSBAR                                              */
    /* ═══════════════════════════════════════════════════════════════ */
    .status-info {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #7b8580;
      text-transform: uppercase;
    }

    .status-value {
      font-size: 11px;
      color: #6fc97f;
      font-weight: 600;
    }

    .status-value.alert {
      color: #ff6b6b;
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* SCROLLBAR                                                       */
    /* ═══════════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(207, 216, 212, 0.15);
      border-radius: 0;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(207, 216, 212, 0.3);
    }

    /* ═══════════════════════════════════════════════════════════════ */
    /* SCANLINE EFFECT (CRT style)                                     */
    /* ═══════════════════════════════════════════════════════════════ */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      mix-blend-mode: multiply;
      z-index: 999;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">⚔</div>
      <div>
        <div class="brand-title">MRSAM SIMULATOR</div>
        <div class="brand-sub">Operator Console</div>
      </div>
    </div>

    <div class="top-stats">
      <div class="pill">
        <span class="pill-label">MISSION</span>
        <span class="pill-value">M-01</span>
      </div>
      <div class="pill">
        <span class="pill-label">STATUS</span>
        <span class="pill-value" id="sysState">READY</span>
      </div>
      <div class="pill">
        <span class="pill-label">CONTACTS</span>
        <span class="pill-value" id="contactCount">0</span>
      </div>
    </div>

    <div id="topbar-time" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6fc97f; font-weight: 600;">
      00:00:00Z
    </div>
  </header>

  <!-- MAIN LAYOUT: Sidebar + Canvas -->
  <div id="main-container">
    <!-- LEFT SIDEBAR: Dashboard -->
    <div id="sidebar">
      <!-- Tracks Panel -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">TRACKS</span>
          <span class="panel-meta" id="trackCount">0</span>
        </div>
        <div class="tracks-panel">
          <div class="track-head">
            <div>ID</div>
            <div>CLASS</div>
            <div>BRG</div>
            <div>RNG</div>
            <div>ALT</div>
            <div>SPD</div>
            <div>TTG</div>
            <div>HOST</div>
          </div>
          <div id="tracksList"></div>
        </div>
      </div>

      <!-- Radar Scope -->
      <div class="panel scope-panel">
        <div class="panel-head">
          <span class="panel-title">RADAR SCOPE</span>
          <span class="panel-meta">PPI MODE</span>
        </div>
        <div class="scope-wrap">
          <svg id="radarScope" viewBox="0 0 520 520" width="100%" height="100%"></svg>
        </div>
      </div>

      <!-- Batteries Panel -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">BATTERIES</span>
          <span class="panel-meta">SAM SYS</span>
        </div>
        <div class="batteries" id="batteriesList"></div>
      </div>
    </div>

    <!-- RIGHT: Three.js Canvas -->
    <div id="canvas-container">
      <canvas id="app" width="800" height="600"></canvas>
    </div>
  </div>

  <!-- STATUSBAR -->
  <footer id="bottombar">
    <div class="status-info">
      <div class="status-item">
        <span class="status-label">System</span>
        <span class="status-value" id="sysStatus">OPERATIONAL</span>
      </div>
      <div class="status-item">
        <span class="status-label">Radar</span>
        <span class="status-value" id="radarStatus">SCANNING</span>
      </div>
      <div class="status-item">
        <span class="status-label">Datalink</span>
        <span class="status-value" id="datalinkStatus">ACTIVE</span>
      </div>
    </div>

    <div class="status-info" id="bottombar-center">
      <!-- Will be populated by React -->
    </div>

    <div class="status-info">
      <button id="btn-reset" style="padding: 4px 12px; border: 1px solid #6fc97f; background: transparent; color: #6fc97f; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px;">
        ↺ RESET
      </button>
      <button id="btn-launch" style="padding: 4px 12px; border: 1px solid #ff6b6b; background: rgba(255, 107, 107, 0.1); color: #ff6b6b; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px;">
        ⚡ LAUNCH
      </button>
    </div>
  </footer>

  <!-- Three.js via ESM + importmap (build/three.min.js UMD sudah deprecated di r160) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- DASHBOARD UI — didorong oleh data live dari simulasi 3D (lihat script module) -->
  <script>
    // ═══════════════════════════════════════════════════════════════
    // Batteries — statis, representasi visual sistem SAM
    // ═══════════════════════════════════════════════════════════════
    const BATTERIES = [
      { id: "ALPHA-1", status: "READY",    rdy: 4, total: 4, kind: "MR-SAM" },
      { id: "ALPHA-2", status: "READY",    rdy: 3, total: 4, kind: "MR-SAM" },
      { id: "BRAVO-1", status: "TRACKING", rdy: 4, total: 4, kind: "LR-SAM" },
      { id: "BRAVO-2", status: "RELOAD",   rdy: 1, total: 4, kind: "LR-SAM" },
      { id: "CHARLIE", status: "STANDBY",  rdy: 6, total: 6, kind: "SR-PDS" },
    ];

    // Tracks kosong di awal — diisi live oleh simulasi 3D lewat window.__publishContacts
    let appState = {
      tracks: [],
      batteries: BATTERIES,
      selectedTrack: null,
      stats: { hits: 0, misses: 0 },
      currentTime: new Date(),
    };

    // ═══════════════════════════════════════════════════════════════
    // Render Tracks
    // ═══════════════════════════════════════════════════════════════
    function renderTracks() {
      const container = document.getElementById('tracksList');
      container.innerHTML = '';
      appState.tracks.forEach(track => {
        const row = document.createElement('div');
        row.className = `track-row ${appState.selectedTrack === track.id ? 'selected' : ''}`;
        row.innerHTML = `
          <div class="track-cell t-id">${track.id}</div>
          <div class="track-cell t-class">${track.class}</div>
          <div class="track-cell">${String(Math.round(track.bearing)).padStart(3, '0')}°</div>
          <div class="track-cell">${track.range.toFixed(1)}</div>
          <div class="track-cell">${Math.round(track.alt)}</div>
          <div class="track-cell">${Math.round(track.speed)}</div>
          <div class="track-cell">${track.ttg !== null && track.ttg !== undefined ? track.ttg + 's' : '—'}</div>
          <div class="track-cell t-${track.hostility.toLowerCase()}">${track.hostility.charAt(0)}</div>
        `;
        row.onclick = () => {
          appState.selectedTrack = track.id;
          renderTracks();
          renderRadar();
        };
        container.appendChild(row);
      });
      document.getElementById('trackCount').textContent = appState.tracks.length;
      document.getElementById('contactCount').textContent = appState.tracks.length;
    }

    // ═══════════════════════════════════════════════════════════════
    // Render Batteries
    // ═══════════════════════════════════════════════════════════════
    function renderBatteries() {
      const container = document.getElementById('batteriesList');
      container.innerHTML = '';
      appState.batteries.forEach(bat => {
        const div = document.createElement('div');
        div.className = 'battery';
        div.innerHTML = `
          <div class="battery-head">
            <div>
              <div class="battery-id">${bat.id}</div>
              <div class="battery-kind">${bat.kind} • ${bat.status}</div>
            </div>
          </div>
          <div class="battery-cells">
            ${Array.from({ length: bat.total }, (_, i) => `
              <div class="cell ${i < bat.rdy ? 'loaded' : 'empty'}"></div>
            `).join('')}
          </div>
        `;
        container.appendChild(div);
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // Render Radar Scope
    // ═══════════════════════════════════════════════════════════════
    function renderRadar() {
      const svg = document.getElementById('radarScope');
      const SIZE = 520;
      const C = SIZE / 2;
      const MAX_RANGE = 80;

      svg.innerHTML = '';

      // Background
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const grad = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
      grad.setAttribute('id', 'scope-grad');
      grad.setAttribute('cx', '50%');
      grad.setAttribute('cy', '50%');
      grad.setAttribute('r', '50%');
      const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', '#0f1410');
      const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', '#0b0d0b');
      grad.appendChild(stop1);
      grad.appendChild(stop2);
      defs.appendChild(grad);
      svg.appendChild(defs);

      // Background circle
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      bg.setAttribute('cx', C);
      bg.setAttribute('cy', C);
      bg.setAttribute('r', SIZE / 2 - 4);
      bg.setAttribute('fill', 'url(#scope-grad)');
      bg.setAttribute('stroke', '#4a5a50');
      bg.setAttribute('stroke-width', '1');
      svg.appendChild(bg);

      // Range rings
      [20, 40, 60, 80].forEach(r => {
        const radius = (r / MAX_RANGE) * (SIZE / 2 - 16);
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', C);
        circle.setAttribute('cy', C);
        circle.setAttribute('r', radius);
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke', '#4a5a50');
        circle.setAttribute('stroke-width', '0.8');
        circle.setAttribute('stroke-dasharray', '3 4');
        svg.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', C + radius + 2);
        text.setAttribute('y', C - 4);
        text.setAttribute('fill', '#7b8580');
        text.setAttribute('font-size', '9');
        text.setAttribute('font-family', 'JetBrains Mono, monospace');
        text.textContent = r + 'nm';
        svg.appendChild(text);
      });

      // Compass
      [0, 90, 180, 270].forEach(deg => {
        const rad = (deg - 90) * Math.PI / 180;
        const x2 = C + Math.cos(rad) * (SIZE / 2 - 16);
        const y2 = C + Math.sin(rad) * (SIZE / 2 - 16);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', C);
        line.setAttribute('y1', C);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#4a5a50');
        line.setAttribute('stroke-width', '0.6');
        svg.appendChild(line);
      });

      // Cardinal labels
      const labels = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
      labels.forEach(([l, d]) => {
        const rad = (d - 90) * Math.PI / 180;
        const x = C + Math.cos(rad) * (SIZE / 2 - 4);
        const y = C + Math.sin(rad) * (SIZE / 2 - 4) + 4;
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('fill', '#6fc97f');
        text.setAttribute('font-size', '11');
        text.setAttribute('font-family', 'JetBrains Mono, monospace');
        text.setAttribute('font-weight', '700');
        text.setAttribute('text-anchor', 'middle');
        text.textContent = l;
        svg.appendChild(text);
      });

      // SAM site at center
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `translate(${C} ${C})`);
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', '0,-8 7,5 -7,5');
      poly.setAttribute('fill', '#6fc97f');
      g.appendChild(poly);
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '3');
      circle.setAttribute('fill', '#0f1410');
      g.appendChild(circle);

        const y = C + Math.sin(rad) * r;

        text.setAttribute('y', '-8');
        text.setAttribute('fill', color);
        text.setAttribute('font-size', '9');

    function renderStats() {

      const total = hits + misses;
      const acc = total > 0 ? Math.round((hits / total) * 100) : 0;
      el.innerHTML = `
        <div class="status-item"><span class="status-label">Hits</span><span class="status-value">${hits}</span></div>
        <div class="status-item"><span class="status-label">Acc</span><span class="status-value">${total > 0 ? acc + '%' : '—'}</span></div>

    // ═══════════════════════════════════════════════════════════════

    function updateTime() {
      const now = new Date();
      const h = String(now.getUTCHours()).padStart(2, '0');
      const m = String(now.getUTCMinutes()).padStart(2, '0');
      const s = String(now.getUTCSeconds()).padStart(2, '0');
      document.getElementById('topbar-time').textContent = `${h}:${m}:${s}Z`;
    }

    // ═══════════════════════════════════════════════════════════════
    // Initialize
    // ═══════════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', () => {
      renderTracks();
      renderBatteries();
      renderRadar();

      updateTime();

      m.group.lookAt(m.pos.clone().add(m.vel)); m.group.rotateY(Math.PI / 2);
      m.group.visible = true;
      m.trail.head = 0; m.trail.count = 0; m.trail.geom.setDrawRange(0, 0);
      setStatus('TERBANG'); playLaunch();
    }
    function addTrailPoint(tr, p) {
      const i = tr.head * 3;
      tr.pos[i] = p.x; tr.pos[i + 1] = p.y; tr.pos[i + 2] = p.z;
      tr.col[i] = 1; tr.col[i + 1] = 1; tr.col[i + 2] = 1;
      tr.head = (tr.head + 1) % tr.max;
      if (tr.count < tr.max) tr.count++;
      tr.geom.attributes.position.needsUpdate = true; tr.geom.attributes.color.needsUpdate = true;
      tr.geom.setDrawRange(0, tr.count);
    }
    function fadeTrailObj(tr, dt) {
      if (tr.count === 0) return;
      for (let i = 0; i < tr.count; i++) {
        const idx = i * 3;
        tr.col[idx] = Math.max(0, tr.col[idx] - dt * 0.3);
        tr.col[idx + 1] = Math.max(0, tr.col[idx + 1] - dt * 0.4);
        tr.col[idx + 2] = Math.max(0, tr.col[idx + 2] - dt * 0.5);
      }
      tr.geom.attributes.color.needsUpdate = true;
    }
    function updateMissile(m, dt) {
      if (!m.alive) return;
      m.age += dt;
      if (!m.targetRef || !m.targetRef.alive) m.targetRef = assignTarget(m);
      if (m.targetRef && m.targetRef.alive) {
        const toT = m.targetRef.pos.clone().sub(m.pos);
        const dist = toT.length();
        const dirNorm = dist > 1e-4 ? toT.clone().multiplyScalar(1 / dist) : new THREE.Vector3(0, 0, 1);
        const desired = dirNorm.clone().multiplyScalar(MISSILE_SPEED);
        m.vel.lerp(desired, Math.min(1, MANEUVER * dt));
        m.vel.setLength(MISSILE_SPEED);
        const PASS = Math.max(2.0, PROX * 4);
        const closing = m.vel.dot(dirNorm);
        if (dist <= PROX || (dist <= PASS && closing < 0)) {
          const detPos = m.targetRef.pos.clone().add(m.pos).multiplyScalar(0.5);
          triggerExplosion(detPos);
          m.targetRef.alive = false; m.targetRef.group.visible = false;
          m.alive = false; m.group.visible = false; hits++;
          if (AUTO_SPAWN) setTimeout(spawnNewTarget, 1500 + Math.random() * 1500);
          return;
        }
      }
      m.pos.addScaledVector(m.vel, dt);
      m.group.position.copy(m.pos);
      m.group.lookAt(m.pos.clone().add(m.vel)); m.group.rotateY(Math.PI / 2);
      addTrailPoint(m.trail, m.pos);
      m.group.userData.flame.scale.setScalar(0.8 + Math.random() * 0.5);
      const W = roomDim.w, H = roomDim.h, D = roomDim.d;
      const oob = Math.abs(m.pos.x) > W / 2 + 20 || m.pos.y > H + 12 || m.pos.y < -1 || Math.abs(m.pos.z) > D / 2 + 10;
      if (m.age > 14 || oob) { triggerExplosion(m.pos); m.alive = false; m.group.visible = false; misses++; }
    }

    // ═══════════════════════════════════════════════════════════════
    // Jembatan ke dashboard — publish kontak hidup (throttled)
    // ═══════════════════════════════════════════════════════════════
    function makeContact(e, hostility, cls) {
      const dx = e.pos.x - launcherGroup.position.x;
      const dz = e.pos.z - launcherGroup.position.z;
      const rangeM = Math.hypot(dx, dz);
      const maxR = Math.max(roomDim.w, roomDim.d) * 0.7;
      let brg = Math.atan2(dx, -dz) * 180 / Math.PI; if (brg < 0) brg += 360;
      const speed = e.vel.length();
      return {
        id: e.id, class: cls, hostility,
        bearing: brg,
        range: (rangeM / maxR) * 80,   // skala ke unit scope (0–80)
        alt: Math.max(0, e.pos.y),
        speed,
        ttg: hostility === 'HOSTILE' ? Math.round(rangeM / Math.max(1, speed)) : null,
      };
    }
    function publishToDashboard() {
      if (!window.__publishContacts) return;
      const contacts = [];
      for (const t of targets) if (t.alive) contacts.push(makeContact(t, 'HOSTILE', 'SHAHED'));
      for (const m of missiles) if (m.alive) contacts.push(makeContact(m, 'FRIENDLY', 'MSL'));
      window.__publishContacts(contacts, { hits, misses });
    }

    // ═══════════════════════════════════════════════════════════════
    // Kontrol publik untuk tombol dashboard + keyboard
    // ═══════════════════════════════════════════════════════════════
    window.__sim = {
      launch: launchMissile,
      spawn: spawnNewTarget,
      reset: () => { camera.position.copy(initialCamPos); controls.target.set(0, 8, 0); controls.update(); },
    };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); launchMissile(); }
      else if (e.code === 'KeyT') { e.preventDefault(); ensureAudio(); spawnNewTarget(); }
    });
    canvas.addEventListener('click', ensureAudio, { once: true });

    // ═══════════════════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════════════════
    buildRoom(roomDim.w, roomDim.h, roomDim.d);
    radarGroup.position.set(5, 0, 2);
    {
      const half = Math.max(roomDim.w, roomDim.d) * 0.55;
      const sc = sun.shadow.camera;
      sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half;
      sc.updateProjectionMatrix();
      controls.maxDistance = Math.max(roomDim.w, roomDim.d) * 3 + 200;
    }
    rebuildEnvironmentInside(roomDim.w, roomDim.h, roomDim.d);
    spawnNewTarget();

    // ═══════════════════════════════════════════════════════════════
    // Loop
    // ═══════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();
    let pubAcc = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      for (const t of targets) updateTarget(t, dt);
      for (const m of missiles) { updateMissile(m, dt); fadeTrailObj(m.trail, dt); }
      updateParticles(dt);
      if (radarSweepMesh) radarSweepMesh.rotation.y += dt * 1.5;
      if (radarLed) radarLed.material.color.setHex(Math.sin(performance.now() / 200) > 0 ? 0xff2222 : 0x440000);
      pubAcc += dt;
      if (pubAcc > 0.1) { publishToDashboard(); pubAcc = 0; }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize mengikuti container
    window.addEventListener('resize', () => {
      width = container.clientWidth; height = container.clientHeight;
      camera.aspect = width / height; camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
</html>
