<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AEGIDA C2 — Surface-to-Air Command</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d0b; color: #cfd8d4; font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
  #root { height: 100%; }

  .root {
    height: 100%;
    display: grid;
    grid-template-rows: 64px 1fr 32px;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.01em;
  }

  /* subtle scanline overlay for CRT feel */
  .root::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.18) 3px);
    mix-blend-mode: multiply;
    z-index: 1000;
    opacity: 0.5;
  }
  /* vignette */
  .root::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 999;
  }

  /* ── TOP BAR ───────────────────────────────────────── */
  .topbar {
    display: grid;
    grid-template-columns: 280px 1fr auto;
    align-items: center;
    gap: 24px;
    padding: 0 18px;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .topbar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: 0.45;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    background: var(--panel);
    display: grid; place-items: center;
    border-radius: 2px;
  }
  .brand-title {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--primary);
  }
  .brand-sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.18em;
    color: var(--muted);
    margin-top: 2px;
  }

  .top-stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pill {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 6px 10px 6px 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 2px;
    font-family: "JetBrains Mono", monospace;
    line-height: 1;
  }
  .pill-label { font-size: 9px; letter-spacing: 0.18em; color: var(--muted); }
  .pill-value { font-size: 12px; font-weight: 600; color: var(--text); }

  .alert-block {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    border: 1px solid var(--alert);
    border-radius: 2px;
    background: color-mix(in oklch, var(--alert) 8%, var(--panel));
    position: relative;
  }
  .alert-pulse {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--alert);
    box-shadow: 0 0 0 0 var(--alert);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0   color-mix(in oklch, var(--alert) 60%, transparent); }
    70%  { box-shadow: 0 0 0 12px color-mix(in oklch, var(--alert) 0%,  transparent); }
    100% { box-shadow: 0 0 0 0   color-mix(in oklch, var(--alert) 0%,  transparent); }
  }
  .alert-label { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.18em; color: var(--muted); }
  .alert-value { font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 700; color: var(--alert); letter-spacing: 0.1em; }

  /* ── GRID ──────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: 340px 1fr 340px;
    gap: 12px;
    padding: 12px;
    min-height: 0;
    overflow: hidden;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
    color: var(--primary);
  }
  .panel-meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: var(--muted);
  }

  /* TRACK PANEL */
  .tracks-panel { padding-bottom: 8px; overflow-y: auto; }
  .track-table { font-family: "JetBrains Mono", monospace; font-size: 11px; }
  .track-row {
    display: grid;
    grid-template-columns: 48px 60px 36px 38px 36px 36px 48px 36px;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    border-bottom: 1px solid color-mix(in oklch, var(--border) 50%, transparent);
    cursor: pointer;
    transition: background 0.1s;
  }
  .track-row:hover { background: color-mix(in oklch, var(--primary) 6%, transparent); }
  .track-row.selected {
    background: color-mix(in oklch, var(--primary) 14%, transparent);
    border-left: 2px solid var(--primary);
    padding-left: 8px;
  }
  .track-head {
    color: var(--muted); font-size: 9px; letter-spacing: 0.12em; cursor: default;
    background: color-mix(in oklch, var(--bg-deep) 60%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .track-head:hover { background: color-mix(in oklch, var(--bg-deep) 60%, transparent); }
  .t-id { color: var(--text); font-weight: 600; }
  .t-class { color: var(--muted); font-size: 10px; }

  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 10px 12px;
  }
  .detail-grid > div {
    padding: 6px 8px;
    background: var(--bg-deep);
    border: 1px solid color-mix(in oklch, var(--border) 60%, transparent);
  }
  .dl { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 3px; }
  .dv { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; color: var(--text); }

  /* SCOPE */
  .scope-panel { padding: 0; }
  .scope-wrap {
    flex: 1;
    position: relative;
    display: grid; place-items: center;
    background:
      radial-gradient(circle at center, var(--bg-deep) 0%, var(--bg) 100%);
    padding: 14px;
    min-height: 0;
  }
  .scope-wrap > svg { max-height: 100%; max-width: 100%; aspect-ratio: 1; }
  .scope-corners {
    position: absolute; inset: 14px;
    pointer-events: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .corner {
    display: flex; gap: 8px; align-items: baseline;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--text);
    padding: 6px 8px;
    background: color-mix(in oklch, var(--bg-deep) 70%, transparent);
    border: 1px solid color-mix(in oklch, var(--border) 70%, transparent);
    align-self: start; justify-self: start;
    height: fit-content;
  }
  .corner.tr { align-self: start; justify-self: end; }
  .corner.bl { align-self: end;   justify-self: start; }
  .corner.br { align-self: end;   justify-self: end; }
  .corner .muted { color: var(--muted); }

  /* ENGAGEMENTS */
  .engagements { border-top: 1px solid var(--border); }
  .eng-list { display: flex; flex-direction: column; }
  .eng-row {
    display: grid;
    grid-template-columns: 80px 18px 80px 100px 1fr 70px;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    border-bottom: 1px solid color-mix(in oklch, var(--border) 40%, transparent);
  }
  .eng-bat { color: var(--primary); font-weight: 600; }
  .eng-arr { color: var(--muted); text-align: center; }
  .eng-trk { color: var(--red); font-weight: 600; }
  .eng-phase {
    text-align: center;
    padding: 3px 8px;
    border: 1px solid currentColor;
    font-size: 9px; letter-spacing: 0.14em;
  }
  .ph-LAUNCH    { color: var(--primary); }
  .ph-BOOST     { color: var(--primary); }
  .ph-MIDCOURSE { color: var(--amber); }
  .ph-TERMINAL  { color: var(--red); animation: blink 0.6s steps(2) infinite; }
  .ph-DONE      { color: var(--muted); }
  @keyframes blink { 50% { opacity: 0.35; } }
  .eng-bar {
    height: 6px; background: var(--bg-deep);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .eng-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--red));
    transition: width 0.2s linear;
  }
  .eng-time { color: var(--muted); text-align: right; font-size: 10px; }

  /* BATTERIES */
  .right-panel { overflow-y: auto; }
  .batteries {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 10px;
  }
  .battery {
    border: 1px solid var(--border);
    background: var(--bg-deep);
    padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .battery-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .battery-id { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.06em; }
  .battery-kind { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--muted); margin-top: 2px; }
  .battery-cells {
    display: flex; gap: 4px;
  }
  .cell {
    flex: 1; height: 14px;
    border: 1px solid var(--border);
    position: relative;
  }
  .cell.loaded {
    background: color-mix(in oklch, var(--primary) 35%, transparent);
    border-color: var(--primary);
    box-shadow: inset 0 0 6px color-mix(in oklch, var(--primary) 30%, transparent);
  }
  .cell.empty { background: var(--bg); opacity: 0.55; }
  .cell.empty::after { content: ""; position: absolute; inset: 4px; border: 1px dashed color-mix(in oklch, var(--muted) 50%, transparent); }
  .battery-foot {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
  }
  .btn-mini {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; font-weight: 700;
    padding: 4px 10px;
    border: 1px solid var(--primary);
    background: color-mix(in oklch, var(--primary) 10%, transparent);
    color: var(--primary);
    cursor: pointer;
    border-radius: 0;
  }
  .btn-mini:hover:not(:disabled) {
    background: color-mix(in oklch, var(--primary) 30%, transparent);
    color: #fff;
  }
  .btn-mini:disabled { opacity: 0.3; cursor: not-allowed; }

  /* LOG */
  .log {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    padding: 4px 0;
    max-height: 220px; overflow-y: auto;
  }
  .log-row {
    display: grid; grid-template-columns: 64px 50px 1fr;
    gap: 8px;
    padding: 4px 12px;
    align-items: baseline;
  }
  .log-t { color: var(--muted); font-size: 9px; }
  .log-lvl { font-size: 9px; letter-spacing: 0.12em; font-weight: 700; }
  .log-msg { color: var(--text); }
  .lvl-info  .log-lvl { color: var(--primary); }
  .lvl-warn  .log-lvl { color: var(--amber); }
  .lvl-engage .log-lvl { color: var(--red); }
  .lvl-engage .log-msg { color: var(--text); font-weight: 600; }

  /* FOOTER */
  .footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    align-items: center;
    padding: 0 18px;
    background: var(--bg-deep);
    border-top: 1px solid var(--border);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--text);
  }
  .foot-cluster { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .foot-cluster .muted { color: var(--muted); letter-spacing: 0.16em; font-size: 9px; }
  .foot-cluster .sep { color: var(--border); padding: 0 2px; }
  .footer > .foot-cluster:nth-child(3) { justify-content: flex-end; }

  .muted { color: var(--muted); }
  .small { font-size: 10px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
</body>
</html>
